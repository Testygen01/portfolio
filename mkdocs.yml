site_name: Justice I. Chukwuemeka
site_description: Junior systems engineer focused on Linux infrastructure and research computing

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/landing.css

nav:
  - Home: index.md
  - About:
      - About Me: about/about-me.md
      - Rotation Program Overview: about/rotation-program-overview.md
      - Skills Matrix: about/skills.md
      - Timeline: about/timeline.md
      - Career Growth: about/career-growth.md
  - Rotations:
      - Help Desk: rotations/help-desk-summary.md
      - Public Cloud: rotations/public-cloud-summary.md
      - CHTC: rotations/chtc-summary.md
  - Case Studies:
      - Help Desk:
          - Service Account Governance: case-studies/help-desk/service-account-governance.md
          - Python Environment Resolution: case-studies/help-desk/python-environment-resolution.md
          - ChromeOS Cryptohome Failure: case-studies/help-desk/chromeos-cryptohome-failure.md
          - MFA Browser Compatibility: case-studies/help-desk/mfa-browser-compatibility.md
      - Public Cloud:
          - AWS Innovation Sandbox: case-studies/public-cloud/aws-innovation-sandbox.md
          - Jira Automation: case-studies/public-cloud/jira-automation.md
          - AWS AI Security Research: case-studies/public-cloud/aws-ai-security-research.md
          - Cloud Security Assessment: case-studies/public-cloud/cloud-security-assessment.md
          - Knowledge Base Audit: case-studies/public-cloud/knowledge-base-accessibility-audit.md
      - CHTC:
          - HTCondor Node Troubleshooting: case-studies/chtc/htcondor-node-troubleshooting.md
          - Data Migration: case-studies/chtc/rsync-data-migration.md
          - RACADM Maintenance: case-studies/chtc/dell-racadm-maintenance.md
  #- Resume: resume/resume.pdf

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/Testygen01

        - icon: fontawesome/brands/linkedin
          link: https://linkedin.com/in/justice-c-342b61172
